<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>E46 OBD</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f5f7;--card:#fff;--text:#14171c;--muted:#6b7280;--accent:#1c69d4;--danger:#c62828;--line:#e3e5e9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#1a1d23;--text:#eceff4;--muted:#9aa3b2;--accent:#5b9dff;--danger:#ef6b6b;--line:#2a2e36}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#1a1d23;--text:#eceff4;--muted:#9aa3b2;--accent:#5b9dff;--danger:#ef6b6b;--line:#2a2e36}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0 0 4px}
#status{color:var(--muted);font-size:14px;min-height:20px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:#fff}
button.sec{background:var(--card);color:var(--text);border:1px solid var(--line)}
button.danger{background:var(--danger)}
button:disabled{opacity:.4}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.card small{display:block;color:var(--muted);font-size:12px}
.card b{font-size:22px;font-variant-numeric:tabular-nums}
.card span{color:var(--muted);font-size:13px;margin-left:4px}
h2{font-size:16px;margin:18px 0 8px}
#dtc div{font-family:ui-monospace,Menlo,monospace;padding:6px 0;border-bottom:1px solid var(--line)}
details{margin-top:18px}
a{color:var(--accent)}
input{font:inherit;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--card);color:var(--text);flex:1;min-width:0}
.mod{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-family:ui-monospace,Menlo,monospace}
#udsOut,#tOut{white-space:pre-wrap;word-break:break-all;font:12px ui-monospace,Menlo,monospace;margin-top:8px}
#log{white-space:pre-wrap;word-break:break-all;font:12px ui-monospace,Menlo,monospace;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;max-height:240px;overflow:auto}
</style>
</head>
<body>
<main>
<h1>E46 OBD</h1>
<div id="status">Откройте страницу в браузере Bluefy и нажмите «Подключить адаптер».</div>
<div class="row">
  <button id="bConn">Подключить адаптер</button>
  <button id="bStop" class="sec" disabled>Остановить</button>
</div>
<div class="grid" id="grid"></div>
<h2>Ошибки</h2>
<div class="row">
  <button id="bRead" class="sec" disabled>Прочитать коды</button>
  <button id="bClear" class="danger" disabled>Стереть коды</button>
</div>
<div id="dtc"></div>
<h2>Блоки (CAN/UDS)</h2>
<div class="row"><button id="bScan" class="sec" disabled>Найти блоки</button></div>
<div id="mods"></div>
<div id="udsOut"></div>
<h2>Терминал</h2>
<div class="row"><input id="tIn" placeholder="например ATDP или 0100" autocapitalize="characters" autocomplete="off"><button id="tSend" class="sec" disabled>Отправить</button></div>
<div id="tOut"></div>
<details><summary>Лог обмена (для отладки)</summary><pre id="log"></pre></details>
</main>
<script>
(() => {
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const log = m => { const l = $('#log'); l.textContent += m + '\n'; l.scrollTop = l.scrollHeight; };
const status = m => { $('#status').textContent = m; };
const errText = e => (e && (e.name || e.message)) ? ((e.name || '') + ': ' + (e.message || '')) : 'неизвестная ошибка (' + String(e) + ')';

const METRICS = [
  {pid:0x04, t:'Нагрузка двигателя', u:'%',      f:b => b[0]*100/255},
  {pid:0x05, t:'Температура ОЖ',     u:'°C',     f:b => b[0]-40},
  {pid:0x0B, t:'Давление во впуске', u:'кПа',    f:b => b[0]},
  {pid:0x0C, t:'Обороты',            u:'об/мин', f:b => (b[0]*256+b[1])/4},
  {pid:0x0D, t:'Скорость',           u:'км/ч',   f:b => b[0]},
  {pid:0x0F, t:'Темп. впуска',       u:'°C',     f:b => b[0]-40},
  {pid:0x10, t:'Расход воздуха',     u:'г/с',    f:b => (b[0]*256+b[1])/100},
  {pid:0x42, t:'Напряжение',         u:'В',      f:b => (b[0]*256+b[1])/1000},
  {pid:0x5C, t:'Температура масла',  u:'°C',     f:b => b[0]-40}
];
const U = h => '0000' + h + '-0000-1000-8000-00805f9b34fb';
const SERVICES = [U('fff0'), U('ffe0'), U('ffe5'), U('18f0'),
  'e7810a71-73ae-499d-8c15-faa9aef0c3f2', '49535343-fe7d-4ae5-8fa9-9fafd205e455'];

let wch = null, nch = null, buf = '', pending = null, running = false, action = null, active = [];

function onData(e) {
  buf += new TextDecoder().decode(e.target.value);
  if (buf.includes('>') && pending) {
    const p = pending; pending = null; clearTimeout(p.t);
    const lines = buf.replace(/>/g, '').split(/[\r\n]+/).map(s => s.trim()).filter(Boolean);
    buf = '';
    log('< ' + lines.join(' | '));
    p.res(lines);
  }
}

function send(cmd, to = 5000) {
  return new Promise((res, rej) => {
    buf = '';
    const t = setTimeout(() => { pending = null; rej(new Error('нет ответа на ' + cmd)); }, to);
    pending = {res, t};
    const d = new TextEncoder().encode(cmd + '\r');
    log('> ' + cmd);
    const w = wch.properties.writeWithoutResponse ? wch.writeValueWithoutResponse(d) : wch.writeValue(d);
    w.catch(e => { clearTimeout(t); pending = null; rej(e); });
  });
}

async function bytes(pid, to = 5000) {
  const h = pid.toString(16).padStart(2, '0').toUpperCase();
  const tag = '41' + h;
  for (const l of await send('01' + h, to)) {
    const x = l.replace(/\s/g, '');
    if (x.startsWith(tag)) return (x.slice(4).match(/../g) || []).map(v => parseInt(v, 16));
  }
  return null;
}

async function supported() {
  const s = new Set(); let base = 0;
  while (true) {
    const b = await bytes(base, 20000);
    if (!b || b.length < 4) break;
    for (let i = 0; i < 32; i++) if (b[i >> 3] & (0x80 >> (i & 7))) s.add(base + i + 1);
    if (!s.has(base + 0x20) || base >= 0x60) break;
    base += 0x20;
  }
  return s;
}

const DESC = {
P0016:'Рассогласование коленвала и распредвала',P0087:'Низкое давление в топливной рампе',P0088:'Слишком высокое давление в топливной рампе',P0089:'Регулятор давления топлива: неисправность',
P0100:'Датчик расхода воздуха (MAF): цепь',P0101:'MAF: сигнал вне диапазона',P0102:'MAF: низкий сигнал',P0103:'MAF: высокий сигнал',
P0105:'Датчик давления во впуске (MAP): цепь',P0106:'MAP: сигнал вне диапазона',P0107:'MAP: низкий сигнал',P0108:'MAP: высокий сигнал',
P0110:'Датчик температуры воздуха на впуске: цепь',P0115:'Датчик температуры ОЖ: цепь',P0116:'Датчик температуры ОЖ: вне диапазона',P0117:'Датчик температуры ОЖ: низкий сигнал',P0118:'Датчик температуры ОЖ: высокий сигнал',
P0120:'Датчик положения педали/дросселя: цепь',P0121:'Датчик положения педали/дросселя: вне диапазона',P0122:'Датчик положения педали/дросселя: низкий сигнал',P0123:'Датчик положения педали/дросселя: высокий сигнал',
P0128:'Термостат: температура ОЖ ниже нормы',P0130:'Лямбда-зонд 1: цепь',P0171:'Бедная смесь (ряд 1)',P0172:'Богатая смесь (ряд 1)',P0174:'Бедная смесь (ряд 2)',P0175:'Богатая смесь (ряд 2)',
P0217:'Перегрев двигателя',P0234:'Избыточное давление наддува',P0235:'Датчик давления наддува: цепь',P0236:'Датчик давления наддува: вне диапазона',P0237:'Датчик давления наддува: низкий сигнал',P0238:'Датчик давления наддува: высокий сигнал',P0299:'Недостаточное давление наддува',
P0300:'Пропуски зажигания (несколько цилиндров)',P0325:'Датчик детонации: цепь',P0335:'Датчик коленвала: цепь',P0336:'Датчик коленвала: вне диапазона',P0340:'Датчик распредвала: цепь',P0341:'Датчик распредвала: вне диапазона',
P0380:'Свечи накала: цепь',P0400:'Рециркуляция ОГ (EGR): неисправность',P0401:'EGR: недостаточный поток',P0402:'EGR: избыточный поток',P0403:'EGR: цепь клапана',P0404:'EGR: вне диапазона',
P0420:'Катализатор: эффективность ниже порога',P0430:'Катализатор (ряд 2): эффективность ниже порога',P0440:'Система улавливания паров (EVAP): неисправность',P0442:'EVAP: малая утечка',P0455:'EVAP: большая утечка',
P0500:'Датчик скорости автомобиля',P0560:'Напряжение бортсети: неисправность',P0562:'Низкое напряжение бортсети',P0563:'Высокое напряжение бортсети',P0571:'Выключатель стоп-сигнала: цепь',
P0600:'Ошибка CAN-связи между блоками',P0601:'Ошибка памяти ЭБУ (контрольная сумма)',P0602:'Ошибка программирования ЭБУ',P0606:'Неисправность процессора ЭБУ',P0620:'Генератор: цепь управления',P0670:'Блок управления свечами накала',
P0700:'Неисправность системы управления АКПП',P0715:'Датчик частоты вращения входного вала АКПП',P0720:'Датчик частоты вращения выходного вала АКПП',P0730:'Неверное передаточное число АКПП',P0741:'Блокировка гидротрансформатора: не включается',P0750:'Соленоид переключения A (АКПП)',P0755:'Соленоид переключения B (АКПП)',
P2002:'Сажевый фильтр (DPF): эффективность ниже порога',U0100:'Нет связи с блоком двигателя',U0101:'Нет связи с блоком АКПП',U0121:'Нет связи с блоком ABS',U0140:'Нет связи с блоком кузова',U0155:'Нет связи с панелью приборов'
};
function describe(c) {
  if (DESC[c]) return DESC[c];
  let m;
  if ((m = c.match(/^P020([1-8])$/))) return 'Форсунка цилиндра ' + m[1] + ': цепь';
  if ((m = c.match(/^P030([1-8])$/))) return 'Пропуски зажигания в цилиндре ' + m[1];
  if ((m = c.match(/^P067([1-8])$/))) return 'Свеча накала цилиндра ' + m[1] + ': цепь';
  return 'нет в базе';
}
function dtcRow(c, x) {
  const d = document.createElement('div');
  d.textContent = c + (x ? ' [' + x + ']' : '') + ' — ' + describe(c.slice(0, 5)) + ' ';
  const a = document.createElement('a');
  a.textContent = 'искать'; a.target = '_blank'; a.rel = 'noopener';
  a.href = 'https://www.google.com/search?q=' + encodeURIComponent(c.slice(0, 5) + ' ошибка расшифровка');
  d.appendChild(a);
  return d;
}

function decodeDTC(h) {
  if (h.length !== 4 || h === '0000') return null;
  const v = parseInt(h, 16);
  return 'PCBU'[v >> 14] + ((v >> 12) & 3) + (v & 0xFFF).toString(16).toUpperCase().padStart(3, '0');
}

async function readDTC() {
  const out = new Set();
  for (const l of await send('03', 10000)) {
    let h = l.replace(/\s/g, '');
    if (!h.startsWith('43')) continue;
    h = h.slice(2);
    if (h.length % 4 === 2) h = h.slice(2); // CAN добавляет байт-счётчик, K-line (E46) нет
    for (let i = 0; i + 4 <= h.length; i += 4) { const c = decodeDTC(h.substr(i, 4)); if (c) out.add(c); }
  }
  const box = $('#dtc');
  box.innerHTML = '';
  if (!out.size) box.textContent = 'Ошибок нет';
  [...out].sort().forEach(c => box.appendChild(dtcRow(c)));
}

async function restore() {
  for (const c of ['ATCRA', 'ATSH7DF', 'ATH0', 'ATSP0']) { try { await send(c, 3000); } catch (e) {} }
}
function hexBody(lines) {
  let h = '';
  for (let l of lines) { l = l.replace(/\s/g, ''); if (/^[0-9A-F]{3}$/.test(l)) continue; h += l.replace(/^[0-9A-F]:/, ''); }
  return h;
}
function showMods(list) {
  const b = $('#mods'); b.innerHTML = '';
  if (!list.length) { b.textContent = 'Блоки не ответили (нужен автомобиль с CAN).'; return; }
  list.forEach(m => {
    const d = document.createElement('div'); d.className = 'mod';
    const t = document.createElement('span'); t.textContent = m.req + ' → ' + m.resp;
    const bt = document.createElement('button'); bt.className = 'sec'; bt.textContent = 'Ошибки';
    bt.onclick = () => { action = {t: 'uds', m}; };
    d.append(t, bt); b.appendChild(d);
  });
}
async function scanMods() {
  const found = [];
  $('#mods').textContent = 'Поиск блоков… до 2 минут, не закрывайте страницу.';
  try {
    for (const c of ['ATSP6', 'ATH1', 'ATST19']) await send(c, 5000);
    for (let id = 0x700; id <= 0x7FF && running; id++) {
      if (id === 0x7DF) continue;
      const req = id.toString(16).toUpperCase();
      await send('ATSH' + req, 2000);
      const r = await send('3E00', 2000).catch(() => []);
      const hit = r.map(l => l.replace(/\s/g, '')).find(l => /^7[0-9A-F]{2}([0-9A-F]{2})+$/.test(l));
      if (hit && hit.slice(0, 3) !== req) found.push({req, resp: hit.slice(0, 3)});
    }
  } catch (e) { log('! scan ' + errText(e)); }
  await restore(); showMods(found);
}
async function udsDTC(m) {
  const o = $('#udsOut'); o.textContent = 'Чтение…';
  try {
    for (const c of ['ATH0', 'ATSH' + m.req, 'ATCRA' + m.resp, 'ATST64']) await send(c, 3000);
    const h = hexBody(await send('1902FF', 8000));
    if (h.startsWith('5902')) {
      const out = [];
      for (let i = 6; i + 8 <= h.length; i += 8) {
        const c = decodeDTC(h.substr(i, 4));
        if (c) out.push({c, x: h.substr(i + 4, 2) + ' / статус ' + h.substr(i + 6, 2)});
      }
      o.textContent = m.req + ': ' + (out.length ? '' : 'ошибок нет');
      out.forEach(e => o.appendChild(dtcRow(e.c, e.x)));
    } else o.textContent = m.req + ': ответ ' + (h || 'нет данных');
  } catch (e) { o.textContent = 'Ошибка: ' + errText(e); }
  await restore();
}
async function term(cmd) {
  const o = $('#tOut'); o.textContent += '> ' + cmd + '\n';
  try { o.textContent += (await send(cmd, 10000)).join('\n') + '\n'; }
  catch (e) { o.textContent += '! ' + errText(e) + '\n'; }
}
async function doExt(a) {
  if (a.t === 'scan') await scanMods(); else if (a.t === 'uds') await udsDTC(a.m); else if (a.t === 'term') await term(a.cmd);
}

function buttons() {
  $('#bScan').disabled = !running;
  $('#tSend').disabled = !running;
  $('#bConn').disabled = running;
  $('#bStop').disabled = !running;
  $('#bRead').disabled = !running;
  $('#bClear').disabled = !running;
}

function render() {
  const g = $('#grid'); g.innerHTML = '';
  active.forEach(m => {
    const c = document.createElement('div'); c.className = 'card';
    c.innerHTML = '<small></small><b id="v' + m.pid + '">—</b><span></span>';
    c.querySelector('small').textContent = m.t;
    c.querySelector('span').textContent = m.u;
    g.appendChild(c);
  });
}

async function run() {
  running = true; buttons();
  try {
    try { await navigator.wakeLock?.request('screen'); } catch (e) {}
    status('Инициализация адаптера…');
    for (const c of ['ATZ', 'ATE0', 'ATL0', 'ATS0', 'ATH0', 'ATAT1', 'ATSP0']) await send(c, c === 'ATZ' ? 8000 : 5000);
    status('Связь с ЭБУ (на K-line до 10 с)…');
    const sup = await supported();
    if (!sup.size) { status('ЭБУ не отвечает. Зажигание включено? Адаптер вставлен до конца?'); running = false; buttons(); return; }
    active = METRICS.filter(m => sup.has(m.pid)); render();
    status('Протокол: ' + (await send('ATDP', 3000)).join(' '));
    while (running) {
      for (const m of active) {
        if (!running) break;
        const b = await bytes(m.pid);
        if (b && b.length) $('#v' + m.pid).textContent = m.f(b).toFixed(1);
      }
      if (action === 'read') { action = null; await readDTC(); }
      else if (action === 'clear') { action = null; await send('04', 10000); $('#dtc').textContent = 'Коды стёрты. Нажмите «Прочитать коды» для проверки.'; }
      if (action && action.t) { const a = action; action = null; await doExt(a); }
      await sleep(100);
    }
  } catch (e) { status('Ошибка: ' + errText(e)); log('! ' + errText(e)); }
  running = false; buttons();
}

async function connect() {
  if (!navigator.bluetooth) { status('Web Bluetooth недоступен. Откройте страницу в браузере Bluefy.'); return; }
  try {
    wch = nch = null;
    log('запрос устройства…');
    const dev = await navigator.bluetooth.requestDevice({acceptAllDevices: true, optionalServices: SERVICES});
    dev.addEventListener('gattserverdisconnected', () => { running = false; status('Адаптер отключился.'); buttons(); });
    log('выбрано: ' + dev.name);
    status('Подключение…');
    const srv = await dev.gatt.connect();
    log('GATT подключён');
    for (const s of await srv.getPrimaryServices()) {
      for (const c of await s.getCharacteristics()) {
        const p = c.properties;
        if (!nch && (p.notify || p.indicate)) nch = c;
        if (!wch && (p.write || p.writeWithoutResponse)) wch = c;
      }
    }
    if (!nch || !wch) throw new Error('не найден канал ELM327 (смотрите лог)');
    log('канал: notify ' + nch.uuid + ', write ' + wch.uuid);
    await nch.startNotifications();
    nch.addEventListener('characteristicvaluechanged', onData);
    run();
  } catch (e) { status('Ошибка: ' + errText(e)); log('! ' + errText(e)); }
}

$('#bConn').onclick = connect;
$('#bStop').onclick = () => { running = false; };
$('#bRead').onclick = () => { action = 'read'; };
$('#bClear').onclick = () => { if (confirm('Стереть коды ошибок?')) action = 'clear'; };
$('#bScan').onclick = () => { action = {t: 'scan'}; };
$('#tSend').onclick = () => { const v = $('#tIn').value.trim(); if (v) { action = {t: 'term', cmd: v}; $('#tIn').value = ''; } };
log('браузер: ' + navigator.userAgent.slice(0, 90));
buttons();
})();
</script>
</body>
</html>
