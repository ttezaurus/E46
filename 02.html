<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OBD Pro Diagnostics</title>
<!-- Подключаем официальный скрипт Telegram Web App -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#0f1115;--card:#1a1d23;--text:#eceff4;--muted:#9aa3b2;--accent:#5b9dff;--danger:#ef6b6b;--warning:#ffb74d;--line:#2a2e36}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 6px}
#status{color:var(--muted);font-size:13px;min-height:18px;margin-bottom:12px;word-break:break-word}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:var(--card);color:var(--text);border:1px solid var(--line)}
button.danger{background:var(--danger)}
button.demo{background:#2e7d32;color:#fff}
button:disabled{opacity:.4}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;position:relative}
.card.warn{border-color:var(--warning);background:rgba(245,124,0,0.1)}
.card.alarm{border-color:var(--danger);background:rgba(198,40,40,0.2)}
.card small{display:block;color:var(--muted);font-size:12px}
.card b{font-size:22px}
.card span{color:var(--muted);font-size:13px;margin-left:4px}
.card .hint{font-size:10px;color:var(--accent);display:block;margin-top:2px}
#devLog{white-space:pre-wrap;word-break:break-all;font:11px ui-monospace,monospace;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;max-height:150px;overflow:auto;color:var(--danger)}
#modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:100;justify-content:center;align-items:center;padding:16px;box-sizing:border-box}
#modalContent{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;width:100%;max-width:500px}
.settings-box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;font-size:14px}
.settings-box input{width:60px;background:var(--bg);border:1px solid var(--line);color:var(--text);padding:4px;border-radius:6px;text-align:center}
</style>
</head>
<body>
<main>
<h1>OBD Pro (Telegram Mini App)</h1>
<div id="status">Нажмите «Демо-режим» для теста или «Подключить» в Bluefy.</div>

<div class="row">
  <button id="bConn">Подключить</button>
  <button id="bDemo" class="demo">Демо-режим</button>
  <button id="bStop" class="sec" disabled>Стоп</button>
  <button id="bSendLog" class="sec" style="background:#2a2e36">📤 Выгрузить лог</button>
  <button id="bSettings" class="sec">⚙️ Пороги</button>
</div>

<!-- Блок настройки триггеров алармов (скрыт по умолчанию) -->
<div id="settingsPanel" class="settings-box" style="display:none;">
  <strong>Настройка лимитов (аварийных порогов):</strong>
  <div style="margin-top:8px; display:flex; flex-direction:column; gap:6px;">
    <label>🌡 Макс. температура ОЖ (°C): <input type="number" id="limitECT" value="115"></label>
    <label>⚡ Мин. напряжение сети (В): <input type="number" id="limitVolt" value="11.5" step="0.1"></label>
  </div>
</div>

<div class="grid" id="grid"></div>

<details open style="margin-top:12px"><summary style="cursor:pointer">Лог отладки</summary><pre id="devLog"></pre></details>
</main>

<div id="modal">
  <div id="modalContent">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <h3 id="modalTitle" style="margin:0;font-size:16px">График</h3>
      <button class="sec" id="bCloseModal" style="padding:4px 10px">Закрыть</button>
    </div>
    <canvas id="chartCanvas" width="400" height="200" style="width:100%;height:200px;background:var(--bg);border-radius:8px"></canvas>
  </div>
</div>

<script>
(() => {
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
let logBuf = '';
let running = false, isDemoMode = false, activeMetric = null;
let chartHistory = {};
let unitConversions = {};

const devLog = (msg) => {
  const time = new Date().toLocaleTimeString();
  logBuf += `[${time}] ${msg}\n`;
  const box = $('#devLog');
  if (box) { box.textContent = logBuf.slice(-2000); box.scrollTop = box.scrollHeight; }
};

const status = m => { $('#status').textContent = m; };

const sendLogToTelegram = (text) => {
  if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe) {
    window.Telegram.WebApp.sendData(text);
  } else {
    alert("Функция доступна только при запуске через Telegram Mini App!");
    devLog("Лог (не в Telegram): " + text);
  }
};

const METRICS = [
  {pid:0x0C, k:'12', t:'Обороты двигателя', u:'об/мин', f:b=>(b[0]*256+b[1])/4},
  {pid:0x05, k:'5',  t:'Температура ОЖ', u:'°C', f:b=>b[0]-40},
  {pid:0x0B, k:'11', t:'Давление во впуске', u:'кПа', f:b=>b[0]},
  {pid:0x42, k:'66', t:'Напряжение бортсети', u:'В', f:b=>(b[0]*256+b[1])/1000},
  {pid:0x10, k:'16', t:'Расход воздуха (MAF)', u:'г/с', f:b=>(b[0]*256+b[1])/100},
  {pid:0x5C, k:'92', t:'Температура масла', u:'°C', f:b=>b[0]-40}
];

let active = [...METRICS];

// Управление панелью настроек порогов
$('#bSettings').onclick = () => {
  const panel = $('#settingsPanel');
  panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
};

function renderGrid() {
  const g = $('#grid'); g.innerHTML = '';
  active.forEach(m => {
    const c = document.createElement('div'); c.className = 'card'; c.id = 'card-' + m.k;
    let unit = (unitConversions[m.k] && m.u === 'кПа') ? 'бар' : m.u;
    c.innerHTML = `<small>${m.t}</small><b id="v${m.k}">—</b> <span>${unit}</span><small class="hint">клик: график / кПа↔бар</small>`;
    c.onclick = () => {
      if (m.u === 'кПа') { unitConversions[m.k] = !unitConversions[m.k]; renderGrid(); return; }
      openChart(m);
    };
    g.appendChild(c);
  });
}

function openChart(m) {
  activeMetric = m;
  $('#modalTitle').textContent = m.t;
  $('#modal').style.display = 'flex';
  drawCanvasChart();
}

$('#bCloseModal').onclick = () => { $('#modal').style.display = 'none'; activeMetric = null; };

function drawCanvasChart() {
  if (!activeMetric) return;
  const canvas = $('#chartCanvas');
  const ctx = canvas.getContext('2d');
  const data = chartHistory[activeMetric.k] || [];
  
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (data.length < 2) return;

  const min = Math.min(...data) * 0.9;
  const max = Math.max(...data) * 1.1 || 1;
  
  ctx.beginPath();
  ctx.strokeStyle = '#5b9dff';
  ctx.lineWidth = 2;

  data.forEach((val, i) => {
    const x = (i / (data.length - 1)) * canvas.width;
    const y = canvas.height - ((val - min) / (max - min)) * canvas.height;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();
}

async function loop() {
  running = true;
  $('#bConn').disabled = $('#bDemo').disabled = true;
  $('#bStop').disabled = false;
  devLog('Старт опроса...');

  while (running) {
    // Считываем актуальные значения лимитов из полей (или берем стандартные)
    const maxECT = parseFloat($('#limitECT').value) || 115;
    const minVolt = parseFloat($('#limitVolt').value) || 11.5;

    for (const m of active) {
      if (!running) break;
      let rawVal = 0;
      if (isDemoMode) {
        await sleep(30);
        if (m.k === '12') rawVal = 750 + Math.random() * 50;
        else if (m.k === '5') rawVal = 92 + Math.random() * 5; // В штатном демо-режиме температура нормальная (~92-97°C)
        else if (m.k === '66') rawVal = 14.2;
        else rawVal = Math.random() * 50 + 10;
      }
      
      let val = rawVal;
      if (unitConversions[m.k] && m.u === 'кПа') val = val / 100;

      const el = $('#v' + m.k);
      if (el) el.textContent = val.toFixed(1);

      // Проверка на выход за лимиты (срабатывает только если реально перешагнули введенный порог)
      if (m.k === '5' && val > maxECT) {
        devLog(`⚠️ ВНИМАНИЕ: Перегрев! ОЖ = ${val.toFixed(1)}°C (Лимит: ${maxECT}°C)`);
        sendLogToTelegram(`⚠️ АВАРИЯ! Перегрев двигателя: Температура ОЖ достигла ${val.toFixed(1)}°C (Превышен лимит ${maxECT}°C)`);
      }
      if (m.k === '66' && val < minVolt) {
        devLog(`⚠️ ВНИМАНИЕ: Просадка сети! Напряжение = ${val.toFixed(1)}В`);
        sendLogToTelegram(`⚠️ АВАРИЯ! Низкое напряжение сети: ${val.toFixed(1)}В (Лимит: ${minVolt}В)`);
      }

      if (!chartHistory[m.k]) chartHistory[m.k] = [];
      chartHistory[m.k].push(val);
      if (chartHistory[m.k].length > 40) chartHistory[m.k].shift();

      if (activeMetric && activeMetric.k === m.k) drawCanvasChart();
    }
    await sleep(20);
  }
  
  $('#bConn').disabled = $('#bDemo').disabled = false;
  $('#bStop').disabled = true;
  devLog('Остановлено.');
}

$('#bDemo').onclick = () => { isDemoMode = true; loop(); };
$('#bStop').onclick = () => { running = false; isDemoMode = false; };
$('#bConn').onclick = () => { devLog('Используйте браузер Bluefy на iOS или Chrome на Android.'); };

$('#bSendLog').onclick = () => {
  const logSummary = "📊 Срез параметров OBD Pro:\n" + JSON.stringify(chartHistory, null, 2);
  sendLogToTelegram(logSummary);
};

renderGrid();
devLog('Готов к работе в Telegram Mini App.');
})();
</script>
</body>
</html>
